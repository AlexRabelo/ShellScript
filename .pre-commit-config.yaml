# Pre-commit hooks para qualidade de Shell Script
# Instalação: pip install pre-commit && pre-commit install
# Uso manual: pre-commit run --all-files

repos:
  # ShellCheck - linter principal
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.9.0
    hooks:
      - id: shellcheck
        name: ShellCheck (strict)
        args: ["--enable=all", "-x", "--severity=warning"]
        types: [shell]
        exclude: ^\.github/

  # Bash syntax validation
  - repo: local
    hooks:
      - id: bash-syntax
        name: Bash Syntax Check (bash -n)
        entry: bash -n
        language: system
        types: [shell]
        exclude: ^\.github/

  # Header profissional obrigatório
  - repo: local
    hooks:
      - id: check-headers
        name: Verify Professional Headers
        entry: ./scripts/check-headers.sh
        language: system
        types: [shell]
        exclude: ^\.github/
        pass_filenames: false

  # Conventional Commits validation (commit-msg hook)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        name: Validate Commit Message
        stages: [commit-msg]
        types: [text]

  # Trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        types: [text]
        exclude: ^\.github/
      - id: end-of-file-fixer
        types: [text]
        exclude: ^\.github/
      - id: check-merge-conflict
        types: [text]
      - id: check-yaml
        types: [yaml]
      - id: check-json
        types: [json]

  # Shell script specific: check for common issues
  - repo: local
    hooks:
      - id: shell-best-practices
        name: Shell Best Practices Check
        entry: ./scripts/check-best-practices.sh
        language: system
        types: [shell]
        exclude: ^\.github/
        pass_filenames: false